<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartLib - Create Account</title>
    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #e7ebff;
        }
        h1 { margin-bottom: 25px; color: #001b57; }
        form {
            background: white;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 320px;
            display: flex;
            flex-direction: column;
            border: 2px solid #001b57;
        }
        label { font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #001b57; }
        input, select { padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; background: white; }
        button { padding: 11px; background-color: #162c99; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer; }
        button:hover { background-color: #001b57; }
        .links-container { margin-top: 25px; text-align: center; font-size: 13px; }
        a { color: #162c99; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        .error-message { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; padding: 10px; margin-bottom: 15px; border-radius: 4px; font-size: 13px; text-align: center; }
    </style>
</head>
<body>
    <h1>Create Account</h1>

    {% if error %}
        <div class="error-message"><strong>Registration Alert:</strong> {{ error }}</div>
    {% endif %}

    <form action="/signup" method="POST">
        <label>Institutional Email:</label>
        <input type="email" name="email" placeholder="username@nu.edu.ph" required>

        <label>Designated Role:</label>
        <select name="role" required>
            <option value="student">Student</option>
            <option value="teacher">Teacher (Faculty)</option>
            <option value="librarian">Librarian (Admin)</option>
        </select>

        <label>Password:</label>
        <input type="password" name="password" placeholder="Choose password" required>

        <label>Confirm Password:</label>
        <input type="password" name="confirm_password" placeholder="Confirm password" required>

        <button type="submit">Sign Up and Confirm</button>
    </form>

    <div class="links-container">
        <a href="/login">Already registered? Sign In</a>
    </div>
</body>
</html>
