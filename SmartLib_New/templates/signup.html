<!DOCTYPE html>
<html>
<head>
    <title>SmartLib - Sign Up</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }

        h1 {
            margin-bottom: 25px; /* Adds space between the title and the card */
        }

        form {
            background: white;
            padding: 30px; /* Gives the box breathing room */
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 280px; /* Matches the exact width of the login container */

            display: flex;
            flex-direction: column;
        }

        /* Targets the text labels */
        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        /* Targets all text, email, and password input fields */
        input {
            padding: 10px;
            margin-bottom: 20px; /* Keeps the uniform spacing between rows */
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Targets the solid action button */
        button {
            padding: 10px 20px;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
            align-self: center;
            width: 100%; /* Matches the button stretch of the login screen */
        }

        button:hover {
            background-color: #005999;
        }

        /* Targets the redirect link container at the bottom */
        .login-link {
            display: block;
            margin-top: 25px; /* Spacing below the form card */
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Register Account</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <p style="color: red; text-align: center;"><strong>Alert: {{ message }}</strong></p>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/signup" method="POST">
        <label>Student Email:</label>
        <input type="email" name="email" placeholder="student@nu.edu.ph" required>

        <label>Create Password:</label>
        <input type="password" name="password" placeholder="Enter password" required>

        <label>Confirm Password:</label>
        <input type="password" name="confirm_password" placeholder="Repeat password" required>

        <button type="submit">Sign Up and Confirm</button>
    </form>

    <div class="login-link">
        <a href="/">Already have an account? Go back to Sign In</a>
    </div>
</body>
</html>
