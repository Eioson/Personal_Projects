<!DOCTYPE html>
<html>
<head>
    <title>SmartLib - Sign Up</title>
    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #e7ebff;
        }

        h1 {
            margin-bottom: 25px;
            color: #001b57;
        }

        form {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 320px;
            display: flex;
            flex-direction: column;
            border: 2px solid #001b57;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        input, select {
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            background-color: #fff;
        }

        button {
            padding: 10px 20px;
            background-color: #162c99;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
            align-self: center;
            width: 100%;
        }

        button:hover {
            background-color: #001b57;
        }

        .login-link {
            display: block;
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
        }

        .login-link a {
            color: #162c99;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Register Account</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <p style="color: red; text-align: center; margin-bottom: 15px; font-size: 14px;"><strong>Alert: {{ message }}</strong></p>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/signup" method="POST">
        <label>Username / Email:</label>
        <input type="text" name="username" placeholder="student@nu.edu.ph" required>

        <label>Account Assignment:</label>
        <select name="role" required>
            <option value="student">Student Profile</option>
            <option value="teacher">Faculty / Teacher</option>
            <option value="librarian">Librarian Administrator</option>
        </select>

        <label>Create Password:</label>
        <input type="password" name="password" placeholder="Enter password" required>

        <label>Confirm Password:</label>
        <input type="password" name="confirm_password" placeholder="Repeat password" required>

        <button type="submit">Sign Up and Confirm</button>
    </form>

    <div class="login-link">
        <a href="{{ url_for('login') }}">Already have an account? Go back to Sign In</a>
    </div>
</body>
</html>
