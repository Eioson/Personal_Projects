<!DOCTYPE html>
<html>
<head>
    <title>SmartLib - Log In</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
        }
        h1 {
            font-weight: 300;
            margin-bottom: 20px;
        }
        form {
            background: white;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            width: 300px;
            display: flex;
            flex-direction: column;
            border: 1px solid #eef0f2;
        }
        label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
        }
        input {
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline-color: #007acc;
        }
        button {
            padding: 11px;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #005999;
        }
        .signup-link {
            margin-top: 25px;
            text-align: center;
            font-size: 14px;
        }
        a {
            color: #007acc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .alert-box {
            background-color: #ffeef0;
            border-left: 4px solid #f85149;
            color: #a01c24;
            padding: 10px;
            width: 310px;
            font-size: 13px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>SmartLib Sign In</h1>

    {% with messages = get_flashed_messages(category_filter=["error"]) %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert-box"><strong>Alert:</strong> {{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/" method="POST">
        <label>Email Address:</label>
        <input type="email" name="email" placeholder="student@nu.edu.ph" required>

        <label>Password:</label>
        <input type="password" name="password" placeholder="Enter password" required>

        <button type="submit">Log In</button>
    </form>

    <div class="signup-link">
        <a href="/signup">New to SmartLib? Create an account here</a>
    </div>
</body>
</html>
