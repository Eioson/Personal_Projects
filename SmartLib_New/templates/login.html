<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartLib - Sign In</title>
    <style>
        body {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #e7ebff;
        }
        h1 { margin-bottom: 25px; color: #001b57; }
        form {
            background: white;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 320px;
            display: flex;
            flex-direction: column;
            border: 2px solid #001b57;
        }
        label { font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #001b57; }
        input { padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { padding: 11px; background-color: #162c99; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 14px; cursor: pointer; }
        button:hover { background-color: #001b57; }
        .links-container { margin-top: 25px; text-align: center; font-size: 13px; }
        a { color: #162c99; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        .error-message { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; padding: 10px; margin-bottom: 15px; border-radius: 4px; font-size: 13px; text-align: center; }
    </style>
</head>
<body>
    <h1>SmartLib Sign In</h1>

    {% if error %}
        <div class="error-message"><strong>Error:</strong> {{ error }}</div>
    {% endif %}

    <form action="/login" method="POST">
        <label>Institutional Account Email:</label>
        <input type="text" name="username" placeholder="username@nu.edu.ph" required>

        <label>Password:</label>
        <input type="password" name="password" placeholder="Enter password" required>

        <button type="submit">Log In</button>
    </form>

    <div class="links-container">
        <a href="/signup">Create an Account</a> |
        <a href="/dashboard?username=Guest+User&role=guest" style="color: #555;">Browse as Guest</a>
    </div>
</body>
</html>
